name: loc 

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'COPYRIGHT'
      - 'LICENSE*'
      - '**.md'
      - '**.txt'
      - 'art'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'COPYRIGHT'
      - 'LICENSE*'
      - '**.md'
      - '**.txt'
      - 'art'
  workflow_dispatch:

jobs:
  loc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup update stable && rustup default stable
          rustup component add clippy
          rustup component add rustfmt
      
      - name: Install tokeit
        run: |
          cargo install tokeit --force
      
      - name: Count lines of code (workspace total + each crate)
        run: |
          set -euo pipefail
          # The ONE list. It was two — this loop and a literal array in the
          # upload step — and a crate added to the workspace reached neither,
          # so the report published a smaller number than the workspace had
          # and nothing in a green run said so. The upload step now reads the
          # names out of `loc-crates.txt` instead of restating them.
          #
          # PUBLISHED crates only: `xtask` and `handshake-corpus` are dev-only
          # workspace members and are counted in the `wren` total, not
          # separately.
          crates="websocket-proto http-semantics http1-proto http3-proto wren-trace wren-compio wren-reactor"
          tokeit
          mv tokeit.json loc-wren.json
          for c in $crates; do
            ( cd "$c" && tokeit )
            mv "$c/tokeit.json" "loc-$c.json"
          done
          printf 'wren %s\n' "$crates" > loc-crates.txt
      # Publish only from main: PR runs would overwrite the badge gist with
      # branch stats, and fork PRs have no GIST_PAT secret at all. Every file
      # goes in ONE gist PATCH — per-crate requests trip GitHub's secondary
      # rate limit.
      - name: Upload all loc to the gist in one request
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GIST_PAT }}
          script: |
            const fs = require('fs');
            const gistId = '327b2a8aef9003246e45c6e47fe63937';
            // Gist file name -> LoC json. `wren` is the workspace total; the
            // rest are per-crate. A name here is the `…/raw/<name>` a LoC badge
            // would point at — `websocket-proto` and the workspace total are the
            // two that have one today, and the other entries are published so a
            // README that adds one has a file to point at.
            //
            // The names are READ from the file the step above wrote, never
            // restated here: this was a second copy of that list, and a second
            // copy is a list that can be forgotten. A name with no
            // `loc-<name>.json` beside it still fails the whole PATCH, which is
            // now only reachable if the step above wrote one and moved neither.
            const crates = fs.readFileSync('loc-crates.txt', 'utf8').trim().split(/\s+/);
            const files = {};
            for (const c of crates) {
              files[c] = { content: fs.readFileSync(`loc-${c}.json`, 'utf8') };
            }
            await github.rest.gists.update({ gist_id: gistId, files });
