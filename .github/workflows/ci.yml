name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README'
      - 'COPYRIGHT'
      - 'LICENSE-*'
      - '**.md'
      - '**.txt'
  pull_request:
    paths-ignore:
      - 'README'
      - 'COPYRIGHT'
      - 'LICENSE-*'
      - '**.md'
      - '**.txt'
  workflow_dispatch:
  schedule: [cron: "0 1 */7 * *"]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  codegen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Fail if the committed QPACK tables drift from xtask/src/qpack_data.rs.
      - run: cargo run -p xtask -- qpack-codegen --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-features --tests --examples -- -D warnings
      - run: cargo clippy -p websocket-proto --no-default-features -- -D warnings
      - run: cargo clippy -p websocket-proto --no-default-features --features alloc -- -D warnings
      - run: cargo clippy -p websocket-proto --no-default-features --features deflate -- -D warnings
      - run: cargo clippy -p websocket-proto --no-default-features --features no-atomic -- -D warnings
      - run: cargo clippy -p http1-proto --no-default-features -- -D warnings
      - run: cargo clippy -p http1-proto --no-default-features --features alloc -- -D warnings
      # http1-proto carries websocket-proto's `no-atomic` tier (http3-proto has
      # no such feature), so the lint wall is checked on it too.
      - run: cargo clippy -p http1-proto --no-default-features --features no-atomic -- -D warnings
      - run: cargo clippy -p http3-proto --no-default-features -- -D warnings
      - run: cargo clippy -p http3-proto --no-default-features --features alloc -- -D warnings

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: cargo doc with docsrs cfg
        env:
          RUSTDOCFLAGS: --cfg docsrs -Dwarnings
        run: cargo doc --workspace --all-features --no-deps

  hack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      - run: cargo hack build -p websocket-proto --each-feature
      - run: cargo hack test -p websocket-proto --each-feature
      - run: cargo hack build -p http1-proto --each-feature
      - run: cargo hack test -p http1-proto --each-feature
      - run: cargo hack build -p http3-proto --each-feature
      - run: cargo hack test -p http3-proto --each-feature
      - run: cargo hack test -p wren-trace --each-feature
      # Powerset (8 combos over tls/deflate/tracing): feature-interaction
      # bugs (tls+deflate) escape an each-feature pass.
      - run: cargo hack test -p wren-compio --feature-powerset
      # wren-reactor: build-only powerset (the runtime axis tokio/smol plus
      # tls/deflate/tracing) — the socket tests run --all-features in `test`.
      - run: cargo hack build -p wren-reactor --feature-powerset --no-dev-deps

  test:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p websocket-proto --all-features
      - run: cargo test -p http1-proto --all-features
      - run: cargo test -p http3-proto --all-features
      - run: cargo test -p wren-trace --all-features
      - run: cargo test -p wren-compio --all-features
      - run: cargo test -p wren-reactor --all-features

  no-std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf, thumbv6m-none-eabi, wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p websocket-proto --no-default-features --target thumbv7em-none-eabihf
      - run: cargo check -p websocket-proto --no-default-features --features alloc --target thumbv7em-none-eabihf
      - run: cargo check -p websocket-proto --no-default-features --features alloc,deflate --target thumbv7em-none-eabihf
      - run: cargo check -p websocket-proto --no-default-features --features alloc --target wasm32-unknown-unknown
      # No-atomic bare-metal tier: Cortex-M0+ / thumbv6m-none-eabi (RP2040) has
      # NO native atomic CAS, so the default atomic tier — smol_str's `Arc`,
      # bytes' atomic refcount — cannot build there. The `no-atomic` feature
      # swaps the refcounted text / binary buffers onto `portable_atomic_util::Arc`
      # (CAS via a `critical-section` impl the final binary provides). thumbv7em
      # above HAS atomics, so it does not exercise this path.
      - run: cargo check -p websocket-proto --no-default-features --features no-atomic --target thumbv6m-none-eabi
      # MUST-FAIL: `no-atomic` + `deflate` (without std) is a contradictory
      # combo — deflate's `alloc` dependency drags the atomic-CAS backends in,
      # defeating the tier. lib.rs raises a compile_error!; pin that it fires.
      - run: "! cargo check -p websocket-proto --no-default-features --features no-atomic,deflate 2>/dev/null"
      # http1-proto bare tier: no std, no alloc — the start-line codecs, the head
      # scanner, the body/chunked decoders and the Connection state machine must
      # compile without an allocator. The `const _: () = assert!(…)` size bounds
      # on `Connection` and `HeadView` are unconditional, so these checks are
      # also where they are evaluated for a 32-bit `usize`.
      - run: cargo check -p http1-proto --no-default-features --target thumbv7em-none-eabihf
      - run: cargo check -p http1-proto --no-default-features --target thumbv6m-none-eabi
      - run: cargo check -p http1-proto --no-default-features --features alloc --target thumbv7em-none-eabihf
      - run: cargo check -p http1-proto --no-default-features --features alloc --target wasm32-unknown-unknown
      # The `no-atomic` tier, checked on the core that motivates it — mirroring
      # websocket-proto above. http3-proto has no such feature, so nothing here
      # corresponds to it.
      - run: cargo check -p http1-proto --no-default-features --features no-atomic --target thumbv6m-none-eabi
      # Run the bare tier on the host (x86_64), the same reason as http3-proto's
      # `--test tiers` below: a cross-compiled target cannot execute tests in CI
      # without QEMU. http1-proto has no separate tier smoke — its whole suite is
      # tier-agnostic and runs at `--no-default-features`, so that IS the smoke.
      - run: cargo test -p http1-proto --no-default-features
      # http3-proto bare tier: no std, no alloc — varint/frame/QPACK codecs and
      # the Connection state machine must compile without any allocator.
      - run: cargo check -p http3-proto --no-default-features --target thumbv7em-none-eabihf
      - run: cargo check -p http3-proto --no-default-features --target thumbv6m-none-eabi
      - run: cargo check -p http3-proto --no-default-features --features alloc --target thumbv7em-none-eabihf
      - run: cargo check -p http3-proto --no-default-features --features alloc --target wasm32-unknown-unknown
      # Run the bare-tier smoke test on the host (x86_64) to confirm it executes
      # without panics (cross-compiled targets cannot run tests in CI without QEMU).
      - run: cargo test -p http3-proto --no-default-features --test tiers

  # Proto only: the driver crates do real socket IO, which miri cannot
  # interpret (and their unsafe surface is empty regardless).
  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - run: cargo miri setup
      - run: cargo miri test -p websocket-proto --all-features
        env:
          # proptest under miri is orders of magnitude slower; a handful of
          # cases per property keeps the job in minutes while still running
          # every test through the interpreter.
          PROPTEST_CASES: 8
          # proptest's failure persistence reads/writes regression files
          # (committed in-tree), which needs `getcwd` + file IO — host
          # syscalls miri's isolation rejects. Disabling isolation permits
          # them; UB detection is unaffected.
          MIRIFLAGS: -Zmiri-disable-isolation
      - run: cargo miri test -p http1-proto --all-features
        env:
          PROPTEST_CASES: 8
          MIRIFLAGS: -Zmiri-disable-isolation
      - run: cargo miri test -p http3-proto --all-features
        env:
          PROPTEST_CASES: 8
          MIRIFLAGS: -Zmiri-disable-isolation

  # http1-proto is deliberately absent from this job: it ships no `fuzz/`
  # directory, so there is no `cargo fuzz list` to iterate and adding an empty
  # workspace would only cost a cargo-fuzz build.
  #
  # What stands in its place is a set of BOUNDED, hand-written suites rather than
  # a coverage-guided search, and the difference is worth stating plainly: the
  # `httparse` differential oracle (`tests/differential.rs`) compares two parsers
  # over a fixed corpus, `tests/smuggling.rs` and `tests/smuggling_outbound.rs`
  # pin named vectors in each direction, and `tests/split_robustness.rs` is a
  # proptest property over a fixed corpus with generated CUT POINTS — the inputs
  # are the corpus's, not the fuzzer's. None of them explores unknown input the
  # way a fuzz target does. Add the cache path and a run block here when the
  # crate gains fuzz targets.
  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            websocket-proto/fuzz
            http3-proto/fuzz
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Fuzz all targets — websocket-proto (bounded smoke)
        working-directory: websocket-proto
        # The target is pinned to gnu: recent cargo-fuzz defaults to musl on
        # Linux, where ASAN is incompatible with the statically linked libc
        # (and rustup has no musl std installed here).
        run: |
          for target in $(cargo fuzz list); do
            cargo fuzz run "$target" --target x86_64-unknown-linux-gnu -- -runs=100000 -max_total_time=120
          done
      - name: Fuzz all targets — http3-proto (bounded smoke)
        working-directory: http3-proto
        run: |
          for target in $(cargo fuzz list); do
            cargo fuzz run "$target" --target x86_64-unknown-linux-gnu -- -runs=100000 -max_total_time=120
          done

  # Panic-freedom is enforced statically by the clippy lint wall above; this job
  # adds the link-time half. `no-panic` proves the core leaf primitives compile
  # to panic-free code by failing the LINK if a panic path survives, so it MUST
  # run in release (the optimizer has to prune dead panic branches first; in
  # debug the check is disabled and would false-positive).
  #
  # There is deliberately NO release-symbol panic *scan*: on current toolchains
  # a `pub fn` with a guaranteed panic emits no symbols into the rlib at all
  # (codegen is deferred to downstream binaries) and `cargo bloat` cannot read
  # rlib-only crates, so symbol-grepping either artifact is silently blind. The
  # `no-panic` link test acts at final-binary link time where codegen happens.
  no-panic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: no-panic link-time verification (release)
        run: |
          cargo test -p websocket-proto --release --features test-no-panic --test no_panic
          cargo test -p http3-proto --release --features test-no-panic --test no_panic
      # http1-proto needs FAT LTO on top of `--release`, and the requirement is
      # not cosmetic: its shims call leaves across the crate boundary, so under
      # the default thin-local LTO the panic paths of `core` are still separate
      # codegen units at link time and `no-panic` reports a panic in EVERY shim.
      # Without this env the job would red on a correct crate; a copy of the two
      # lines above is a known-broken shape. It is set per-step rather than on
      # the job so the two crates above keep the profile they were verified
      # under. LTO is not settable per-package in a workspace `Cargo.toml`,
      # which is why this lives here rather than in checked-in config.
      - name: no-panic link-time verification — http1-proto (release + fat LTO)
        env:
          CARGO_PROFILE_RELEASE_LTO: fat
        run: cargo test -p http1-proto --release --features test-no-panic --test no_panic
      # MUST-FAIL, and it is what makes the step above mean anything. `no-panic`
      # proves a shim panic-free by failing the LINK, so a shim that was never
      # instantiated over opaque input passes with an EMPTY proof and nothing in
      # a green run says so — LLVM constant-folds a call made with literals, the
      # body is never compiled for unknown input, and the symbol whose presence
      # would fail the link is never emitted. (Measured: a shim whose body is a
      # guaranteed out-of-bounds index linked clean and reported "ok" until every
      # argument was wrapped in `core::hint::black_box`.)
      #
      # `test-no-panic-lie` adds exactly one such shim, with a reachable panic
      # and its argument fed through `black_box` like every real one, and the
      # build has to FAIL. A green run here reports that the link proof has gone
      # vacuous — a dropped `black_box`, a profile without fat LTO, a `no-panic`
      # release that stopped emitting the symbol — not that anything is fine.
      #
      # The failure is checked for its REASON, not merely for its exit code. "It
      # did not build" is satisfied by a typo, a renamed feature, a dependency
      # that stopped resolving, or any unrelated breakage in the crate — all of
      # which would turn this step green while proving nothing, which is the same
      # vacuity one layer up. So the output is captured and matched against
      # `no-panic`'s own link-error marker naming the shim.
      #
      # Two shell notes, both load-bearing. `set -e` does NOT fire on a command
      # whose status is inverted with `!` (POSIX: the errexit exemption list), so
      # the negation needs its own `||` guard or a lie-check that BUILT would sail
      # past. And stderr is redirected into the log rather than to /dev/null,
      # because the marker is on it.
      - name: no-panic lie-check — the link proof must not be vacuous (MUST FAIL)
        env:
          CARGO_PROFILE_RELEASE_LTO: fat
        run: |
          log="$(mktemp)"
          ! cargo test -p http1-proto --release --features test-no-panic-lie \
            --test no_panic >"$log" 2>&1 || {
            echo "::error::the lie-check BUILT — the no-panic link proof is vacuous"
            exit 1
          }
          grep -q 'ERROR\[no-panic\]: detected panic in function `shim_lie`' "$log" || {
            echo "::error::the lie-check failed to build, but not with no-panic's link error"
            cat "$log"
            exit 1
          }
          echo "lie-check refused to link, for the right reason"
