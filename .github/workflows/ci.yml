name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README'
      - 'COPYRIGHT'
      - 'LICENSE-*'
      - '**.md'
      - '**.txt'
  pull_request:
    paths-ignore:
      - 'README'
      - 'COPYRIGHT'
      - 'LICENSE-*'
      - '**.md'
      - '**.txt'
  workflow_dispatch:
  schedule: [cron: "0 1 */7 * *"]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  codegen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Fail if the committed QPACK tables drift from xtask/src/qpack_data.rs.
      - run: cargo run -p xtask -- qpack-codegen --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-features --tests --examples -- -D warnings
      - run: cargo clippy -p websocket-proto --no-default-features -- -D warnings
      - run: cargo clippy -p websocket-proto --no-default-features --features alloc -- -D warnings
      - run: cargo clippy -p websocket-proto --no-default-features --features deflate -- -D warnings
      - run: cargo clippy -p websocket-proto --no-default-features --features no-atomic -- -D warnings
      # http-semantics carries the same three tier features http1-proto and
      # websocket-proto forward to it, so it meets the same lint wall on each.
      - run: cargo clippy -p http-semantics --no-default-features -- -D warnings
      - run: cargo clippy -p http-semantics --no-default-features --features alloc -- -D warnings
      - run: cargo clippy -p http-semantics --no-default-features --features no-atomic -- -D warnings
      - run: cargo clippy -p http1-proto --no-default-features -- -D warnings
      - run: cargo clippy -p http1-proto --no-default-features --features alloc -- -D warnings
      # http1-proto carries websocket-proto's `no-atomic` tier (http3-proto has
      # no such feature), so the lint wall is checked on it too.
      - run: cargo clippy -p http1-proto --no-default-features --features no-atomic -- -D warnings
      - run: cargo clippy -p http3-proto --no-default-features -- -D warnings
      - run: cargo clippy -p http3-proto --no-default-features --features alloc -- -D warnings

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: cargo doc with docsrs cfg
        env:
          RUSTDOCFLAGS: --cfg docsrs -Dwarnings
        run: cargo doc --workspace --all-features --no-deps
      # --require-all makes a SKIPPED check a failure. Without it, the
      # nightly-only doc-continuity check would vanish silently the day this
      # job is edited, and a green run would not say so.
      - run: cargo run -p xtask -- doc-check --require-all

  hack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      - run: cargo hack build -p websocket-proto --each-feature
      - run: cargo hack test -p websocket-proto --each-feature
      - run: cargo hack build -p http-semantics --each-feature
      - run: cargo hack test -p http-semantics --each-feature
      - run: cargo hack build -p http1-proto --each-feature
      - run: cargo hack test -p http1-proto --each-feature
      - run: cargo hack build -p http3-proto --each-feature
      - run: cargo hack test -p http3-proto --each-feature
      - run: cargo hack test -p wren-trace --each-feature
      # Powerset (8 combos over tls/deflate/tracing): feature-interaction
      # bugs (tls+deflate) escape an each-feature pass.
      - run: cargo hack test -p wren-compio --feature-powerset
      # wren-reactor: build-only powerset (the runtime axis tokio/smol plus
      # tls/deflate/tracing) — the socket tests run --all-features in `test`.
      - run: cargo hack build -p wren-reactor --feature-powerset --no-dev-deps

  test:
    strategy:
      # The one job here that runs on more than one runner, and the only place
      # a cancellation can hide a result. A Windows failure cancelled ubuntu
      # and macos mid-run, so the log said which platform broke and nothing at
      # all about whether the other two would have passed — one platform's
      # failure standing in for every platform's answer. Let all three finish
      # and report their own.
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p websocket-proto --all-features
      - run: cargo test -p http-semantics --all-features
      - run: cargo test -p http1-proto --all-features
      - run: cargo test -p http3-proto --all-features
      - run: cargo test -p wren-trace --all-features
      - run: cargo test -p wren-compio --all-features
      - run: cargo test -p wren-reactor --all-features
      # The gates' own suite. `doc-check` runs in the `doc` job above and
      # `quote-check` in `docs.yml`, but until this step existed nothing in CI
      # ran the tests that check THEM — so a gate that had stopped biting still
      # exited 0 and no job disagreed. It is the same failure those gates exist
      # to catch, one level up. `xtask` has no dependencies and no features, so
      # this runs on all three runners like the steps above it.
      - run: cargo test -p xtask
      # The differential corpus's own suite, and the same argument one level
      # further down. `auth-corpus` carries the ORACLE that says whether an
      # answer from `http-semantics`'s RFC 9110 §11 walk hid a challenge, and
      # every figure published about those fields is one of its verdicts
      # counted. An oracle quietly made more permissive lowers the very number
      # it exists to drive to zero and reports success, and this classifier has
      # twice done exactly that. The suite pins the oracle against values RFC
      # 9110 settles by hand, and pins the per-corpus tally that reproduces the
      # published figures, so a tree that stops reproducing them reds here.
      #
      # It runs the WHOLE corpus — all 935 032 records, thirteen seconds of it
      # in a debug build — rather than a subset, so there is no coverage caveat
      # to remember. It pins a SHA-256 of the ANSWER column too, per corpus and
      # over the whole run, taken with the same hash `auth-diff` publishes with:
      # a tally of verdicts cannot see an answer that moves inside its own axis
      # class, and the only other instrument that can is `auth-diff`, which
      # needs two revisions and so cannot run on a commit.
      # What the digest still cannot say is WHICH record moved — it names the
      # corpus, and its failure names the command that names the record.
      - run: cargo test -p auth-corpus
      # The transfer-coding differential's own suite, and the reason it is a
      # WHOLE-corpus run rather than a subset: it is 245 049 records over four
      # readers and an oracle, and it takes seven seconds in a debug build.
      # There is therefore no coverage caveat to remember here either.
      #
      # It is the only gate in this workspace that asks whether two readers of
      # one RFC 9110 production agree. `grammar::parameterised_list` under
      # `ParamSyntax::TransferParameter`, `http1-proto`'s `Transfer-Encoding`
      # accumulator, `grammar::Expectations` and `media::accept` each have their
      # own tests, each written from the same reading that produced the
      # implementation beside it, so a divergence between two of them was
      # invisible to every other job here — and one lived until an external
      # reviewer read the ABNF (#76).
      #
      # What a green run here is worth is split rather than summed: four of its
      # five pairs are two independent walks (319 359 comparisons) and one is
      # `parameterised_list` against itself at a second configuration (80 434),
      # which proves the configuration and not the reading. The tally keys every
      # pair by that kind, so the two never add up into one coverage number.
      #
      # Its zero-targets are zero-targets rather than pinned constants, and
      # every state it is meant to reach carries the exact count of records that
      # reach it, so a generator edit that makes one unreachable reds here
      # instead of shortening the run and staying green. That is #77's finding
      # about `auth-corpus` above, applied to the corpus written after it.
      - run: cargo test -p coding-corpus

  no-std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf, thumbv6m-none-eabi, wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p websocket-proto --no-default-features --target thumbv7em-none-eabihf
      - run: cargo check -p websocket-proto --no-default-features --features alloc --target thumbv7em-none-eabihf
      - run: cargo check -p websocket-proto --no-default-features --features alloc,deflate --target thumbv7em-none-eabihf
      - run: cargo check -p websocket-proto --no-default-features --features alloc --target wasm32-unknown-unknown
      # No-atomic bare-metal tier: Cortex-M0+ / thumbv6m-none-eabi (RP2040) has
      # NO native atomic CAS, so the default atomic tier — smol_str's `Arc`,
      # bytes' atomic refcount — cannot build there. The `no-atomic` feature
      # swaps the refcounted text / binary buffers onto `portable_atomic_util::Arc`
      # (CAS via a `critical-section` impl the final binary provides). thumbv7em
      # above HAS atomics, so it does not exercise this path.
      - run: cargo check -p websocket-proto --no-default-features --features no-atomic --target thumbv6m-none-eabi
      # MUST-FAIL: `no-atomic` + `deflate` (without std) is a contradictory
      # combo — deflate's `alloc` dependency drags the atomic-CAS backends in,
      # defeating the tier. lib.rs raises a compile_error!; pin that it fires.
      - run: "! cargo check -p websocket-proto --no-default-features --features no-atomic,deflate 2>/dev/null"
      # http-semantics bare tier: no std, no alloc. It is the crate the protocol
      # cores reach RFC 9110's rules THROUGH, so it is checked on every tier they
      # are checked on. `grammar` and `media` live here now, so these steps build
      # the §5.6.6 list walk and the §12.5.1 selection on the embedded targets
      # rather than an empty crate root — the tier this job reports is the tier
      # it tested.
      - run: cargo check -p http-semantics --no-default-features --target thumbv7em-none-eabihf
      - run: cargo check -p http-semantics --no-default-features --target thumbv6m-none-eabi
      - run: cargo check -p http-semantics --no-default-features --features alloc --target thumbv7em-none-eabihf
      - run: cargo check -p http-semantics --no-default-features --features alloc --target wasm32-unknown-unknown
      # The `no-atomic` tier on the core that motivates it, mirroring the two
      # crates that forward this feature down to it.
      - run: cargo check -p http-semantics --no-default-features --features no-atomic --target thumbv6m-none-eabi
      # Bare tier on the host (x86_64), the same reason as http1-proto below: a
      # cross-compiled target cannot execute tests in CI without QEMU.
      - run: cargo test -p http-semantics --no-default-features
      # http1-proto bare tier: no std, no alloc — the start-line codecs, the head
      # scanner, the body/chunked decoders and the Connection state machine must
      # compile without an allocator. The `const _: () = assert!(…)` size bounds
      # on `Connection` and `HeadView` are unconditional, so these checks are
      # also where they are evaluated for a 32-bit `usize`.
      - run: cargo check -p http1-proto --no-default-features --target thumbv7em-none-eabihf
      - run: cargo check -p http1-proto --no-default-features --target thumbv6m-none-eabi
      - run: cargo check -p http1-proto --no-default-features --features alloc --target thumbv7em-none-eabihf
      - run: cargo check -p http1-proto --no-default-features --features alloc --target wasm32-unknown-unknown
      # The `no-atomic` tier, checked on the core that motivates it — mirroring
      # websocket-proto above. http3-proto has no such feature, so nothing here
      # corresponds to it.
      - run: cargo check -p http1-proto --no-default-features --features no-atomic --target thumbv6m-none-eabi
      # Run the bare tier on the host (x86_64), the same reason as http3-proto's
      # `--test tiers` below: a cross-compiled target cannot execute tests in CI
      # without QEMU. http1-proto has no separate tier smoke — its whole suite is
      # tier-agnostic and runs at `--no-default-features`, so that IS the smoke.
      - run: cargo test -p http1-proto --no-default-features
      # http3-proto bare tier: no std, no alloc — varint/frame/QPACK codecs and
      # the Connection state machine must compile without any allocator.
      - run: cargo check -p http3-proto --no-default-features --target thumbv7em-none-eabihf
      - run: cargo check -p http3-proto --no-default-features --target thumbv6m-none-eabi
      - run: cargo check -p http3-proto --no-default-features --features alloc --target thumbv7em-none-eabihf
      - run: cargo check -p http3-proto --no-default-features --features alloc --target wasm32-unknown-unknown
      # Run the bare-tier smoke test on the host (x86_64) to confirm it executes
      # without panics (cross-compiled targets cannot run tests in CI without QEMU).
      - run: cargo test -p http3-proto --no-default-features --test tiers

  # Pure crates only: the driver crates do real socket IO, which miri cannot
  # interpret (and their unsafe surface is empty regardless).
  #
  # Every step here is `xtask miri-test` rather than a bare `cargo miri test`,
  # and that is the gate: it runs the same command with `--report-time
  # --test-threads=1` and fails any single test over a per-test budget. One test
  # that is cheap natively and expensive interpreted — 1.1 s against over two
  # hours — took the `http-semantics` step from minutes to 3 h 10 m, 80% of this
  # job's six-hour limit, and the two crates queued behind it were reported as
  # neither passing nor failing. Nothing failed. It is one command rather than a
  # run and a log check because the second of two steps is the one that gets
  # dropped.
  #
  # The wrapper also owns `PROPTEST_CASES` and `MIRIFLAGS`, which used to sit on
  # each step here: `xtask/src/miri_test.rs` carries both, what they are for,
  # and why a developer measuring locally has to be making the same choices this
  # job makes.
  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - run: cargo miri setup
      - run: cargo run -p xtask -- miri-test websocket-proto
      # http-semantics holds `grammar` and `media` now, so this step runs their
      # unit suites through the interpreter — and, under `--all-features`, the
      # `test-no-panic` shims too, which in debug are plain functions (the link
      # guard is release-only).
      - run: cargo run -p xtask -- miri-test http-semantics
      - run: cargo run -p xtask -- miri-test http1-proto
      - run: cargo run -p xtask -- miri-test http3-proto

  # http1-proto is deliberately absent from this job: it ships no `fuzz/`
  # directory, so there is no `cargo fuzz list` to iterate and adding an empty
  # workspace would only cost a cargo-fuzz build.
  #
  # What stands in its place is a set of BOUNDED, hand-written suites rather than
  # a coverage-guided search, and the difference is worth stating plainly: the
  # `httparse` differential oracle (`tests/differential.rs`) compares two parsers
  # over a fixed corpus, `tests/smuggling.rs` and `tests/smuggling_outbound.rs`
  # pin named vectors in each direction, and `tests/split_robustness.rs` is a
  # proptest property over a fixed corpus with generated CUT POINTS — the inputs
  # are the corpus's, not the fuzzer's. None of them explores unknown input the
  # way a fuzz target does. Add the cache path and a run block here when the
  # crate gains fuzz targets.
  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            websocket-proto/fuzz
            http3-proto/fuzz
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Fuzz all targets — websocket-proto (bounded smoke)
        working-directory: websocket-proto
        # The target is pinned to gnu: recent cargo-fuzz defaults to musl on
        # Linux, where ASAN is incompatible with the statically linked libc
        # (and rustup has no musl std installed here).
        run: |
          for target in $(cargo fuzz list); do
            cargo fuzz run "$target" --target x86_64-unknown-linux-gnu -- -runs=100000 -max_total_time=120
          done
      - name: Fuzz all targets — http3-proto (bounded smoke)
        working-directory: http3-proto
        run: |
          for target in $(cargo fuzz list); do
            cargo fuzz run "$target" --target x86_64-unknown-linux-gnu -- -runs=100000 -max_total_time=120
          done

  # Panic-freedom is enforced statically by the clippy lint wall above; this job
  # adds the link-time half. `no-panic` proves the core leaf primitives compile
  # to panic-free code by failing the LINK if a panic path survives, so it MUST
  # run in release (the optimizer has to prune dead panic branches first; in
  # debug the check is disabled and would false-positive).
  #
  # There is deliberately NO release-symbol panic *scan* over a LIBRARY: on
  # current toolchains a `pub fn` with a guaranteed panic emits no symbols into
  # the rlib at all (codegen is deferred to downstream binaries) and `cargo
  # bloat` cannot read rlib-only crates, so symbol-grepping either artifact is
  # silently blind. The `no-panic` link test acts at final-binary link time
  # where codegen happens — and that is also where the first step below reads
  # the symbols it reads. A TEST BINARY is not an rlib, so the blindness above
  # is not a reason against reading one; it is the reason the link proof works
  # there in the first place.
  no-panic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # FIRST, because it is the only step here that can tell a real proof from
      # an empty one — and because it BUILDS what the steps below then run, so
      # its cost is theirs and not an addition to them.
      #
      # `no-panic` proves a shim by failing the LINK, so a shim never
      # instantiated over opaque input passes with an EMPTY proof: LLVM
      # constant-folds a call made with literals, the body is never compiled for
      # unknown input, and the symbol whose presence would fail the link is
      # never emitted. `core::hint::black_box` at every argument is what stops
      # that, and a consumed answer is what stops the whole call being deleted.
      #
      # The lie-checks below do NOT cover this, and that is measured rather than
      # argued. Put `FrameHeader::encode`'s high-bit-length call site back to
      # bare literals — the exact edit whose reachable panic used to hide — and
      # websocket-proto's real step still links clean and reports `ok` on 6
      # tests, while its lie step still exits 101 on the marker naming
      # `shim_lie`. Both steps green, the crate's proof empty. `shim_lie` is its
      # own subject: it proves that `no-panic`, the profile and `black_box` work
      # FOR IT, and nothing about any real shim. This step is what reds on that
      # edit, naming the shim and the line.
      #
      # It asks TWO questions from two places, and the split is why it is worth
      # a step of its own. How each shim is WRITTEN it reads out of the source,
      # because a symbol table cannot see an argument. Whether each shim was
      # INSTANTIATED it asks the LINKER: it runs each crate's release
      # `--no-run` build — the same invocation, feature and profile as the
      # steps below, so those become cache hits — and requires, per declared
      # shim, a DEFINED FUNCTION symbol whose mangled path is
      # `no_panic::<shim>` in the test binary cargo reports. The whole path and
      # the symbol's kind, not its name: an executable carries every
      # dependency's symbols and every symbol it merely references, so a name
      # alone is spelled by anything in the link. That second half used to
      # be read out of the source too, and it was bypassed four separate times:
      # a call inside `debug_assert!`, a call under a `#[cfg]` release turns
      # off, a call in a helper nothing reaches, and a call spelled inside a raw
      # string literal. Each left both controls in this job green. Reading the
      # artifact has no fifth corner, because it does not read Rust at all.
      #
      # A must-fail mutation per real shim would prove the same thing and cost
      # twenty-four release builds, four of them fat-LTO, growing with every
      # shim added. This costs the four builds the job already does, and prints
      # how many shims it examined, how many the linker instantiated and over
      # how many symbols — so a green run here is distinguishable from a run
      # that never looked.
      - name: no-panic shim structure and instantiation — written opaque, and actually linked
        run: cargo run -p xtask -- shim-check
      # These two run WITHOUT fat LTO, unlike the two steps below, and that is a
      # property of their shims rather than an oversight: the leaves they wrap
      # are `#[inline]`, so they inline into the shim under the default profile
      # and `no-panic` sees the whole body across the crate boundary. Do NOT add
      # `CARGO_PROFILE_RELEASE_LTO: fat` here to "match" the steps below — the
      # profile these were verified under is the one that should keep running
      # them. What the missing LTO costs lands on their lie-checks, and is
      # recorded with those.
      - name: no-panic link-time verification (release)
        run: |
          cargo test -p websocket-proto --release --features test-no-panic --test no_panic
          cargo test -p http3-proto --release --features test-no-panic --test no_panic
      # http1-proto needs FAT LTO on top of `--release`, and the requirement is
      # not cosmetic: its shims call leaves across the crate boundary, so under
      # the default thin-local LTO the panic paths of `core` are still separate
      # codegen units at link time and `no-panic` reports a panic in EVERY shim.
      # Without this env the job would red on a correct crate; a copy of the two
      # lines above is a known-broken shape. It is set per-step rather than on
      # the job so the two crates above keep the profile they were verified
      # under. LTO is not settable per-package in a workspace `Cargo.toml`,
      # which is why this lives here rather than in checked-in config.
      - name: no-panic link-time verification — http1-proto (release + fat LTO)
        env:
          CARGO_PROFILE_RELEASE_LTO: fat
        run: cargo test -p http1-proto --release --features test-no-panic --test no_panic
      # http-semantics needs fat LTO for the same reason http1-proto does, and
      # its steps are a gate the crate did not have rather than a repair of a
      # broken one. Three of the shims here — the RFC 9110 §5.6.6 list walk, the
      # §12.4.2 `qvalue` reader, the §12.5.1 weight selection — used to live in
      # http1-proto's file and proved perfectly well from there across the crate
      # boundary: measured, a panic injected into `media::parse_qvalue` reddened
      # that link naming two shims. They moved so that a change to `grammar` or
      # `media` and the proof covering it land in one crate, and so that
      # `media::parse_qvalue` could stop being `pub` to serve another crate's
      # test. And they moved because the coverage was CONTINGENT: it belonged
      # to another crate's test file, and deleting those three shims there would
      # have been a green diff in a crate that owes `http-semantics` nothing,
      # with no gate of this crate's own reporting the loss. `http-semantics`
      # publishes `panic-free` in its own description and README, as its three
      # siblings do, and each of them owns its proof; this step and its entry in
      # the lie-check below are how this one does. §5.6.7's two halves — the
      # `HTTP-date` reader and the IMF-fixdate writer — joined them later and
      # were measured the same way: with one bounds check replaced by an index,
      # this step reds naming that shim and only that shim.
      - name: no-panic link-time verification — http-semantics (release + fat LTO)
        env:
          CARGO_PROFILE_RELEASE_LTO: fat
        run: cargo test -p http-semantics --release --features test-no-panic --test no_panic
      # MUST-FAIL, and it is what makes every step above mean anything.
      # `no-panic` proves a shim panic-free by failing the LINK, so a shim that
      # was never instantiated over opaque input passes with an EMPTY proof and
      # nothing in a green run says so — LLVM constant-folds a call made with
      # literals, the body is never compiled for unknown input, and the symbol
      # whose presence would fail the link is never emitted.
      #
      # Not hypothetical, and measured three times in this repository now. Once
      # on a shim whose body was a guaranteed out-of-bounds index, which linked
      # clean and reported "ok" until every argument was wrapped in
      # `core::hint::black_box`. And once on each of the two crates whose steps
      # run above without LTO: with their call sites still carrying bare
      # literals, a reachable panic injected into `FrameHeader::encode`'s
      # 63-bit-length refusal arm (websocket-proto) and one replacing
      # `frame::decode_header`'s guarded re-slice with a bare index
      # (http3-proto) BOTH linked clean and reported "ok". With every argument
      # fed through `black_box` the same two injections red, naming
      # `shim_encode` and `shim_frame_decode` respectively.
      #
      # `test-no-panic-lie` adds exactly one such shim to a crate's
      # `tests/no_panic.rs` — a reachable panic, its argument through
      # `black_box` like every real one — and the build has to FAIL. A green run
      # for a crate here reports that ITS link proof has gone vacuous: a dropped
      # `black_box`, a step that lost its fat LTO, a `no-panic` release that
      # stopped emitting the symbol. It does not report that anything is fine.
      #
      # The failure is checked for its REASON, not merely for its exit code. "It
      # did not build" is satisfied by a typo, a renamed feature, a dependency
      # that stopped resolving, or any unrelated breakage in the crate — all of
      # which would turn this step green while proving nothing, which is the same
      # vacuity one layer up. So each build's output is captured and matched
      # against `no-panic`'s own link-error marker naming the shim.
      #
      # For websocket-proto and http3-proto that grep is the WHOLE control
      # rather than an extra check on top of one. Their steps carry no fat LTO,
      # so there is no second, profile-shaped reason their lie build could fail
      # for; drop the grep and nothing stands behind it.
      #
      # ONE assertion over FOUR subjects, deliberately. Four hand-copied copies
      # of a must-fail check are four places for one to be weakened without the
      # others disagreeing. Nothing is pooled but the assertion itself: each
      # call runs its own crate under its own profile, captures its own log, and
      # names its own crate in the `::error::` it raises — the checks are
      # sequential, so the first crate to fail stops the step exactly as four
      # separate steps would.
      #
      # Two shell notes, both load-bearing. `set -e` does NOT fire on a command
      # whose status is inverted with `!` (POSIX: the errexit exemption list), so
      # the negation needs its own `||` guard or a lie-check that BUILT would sail
      # past. And stderr is redirected into the log rather than to /dev/null,
      # because the marker is on it.
      - name: no-panic lie-checks — the four link proofs must not be vacuous (MUST FAIL)
        run: |
          # $1 is the crate; anything after it is an env assignment for that
          # crate's build, which is how the fat-LTO pair keeps the profile its
          # real step above was verified under.
          lie_check() {
            local crate="$1"
            shift
            local log
            log="$(mktemp)"
            ! env "$@" cargo test -p "$crate" --release --features test-no-panic-lie \
              --test no_panic >"$log" 2>&1 || {
              echo "::error::$crate's lie-check BUILT — its no-panic link proof is vacuous"
              exit 1
            }
            grep -q 'ERROR\[no-panic\]: detected panic in function `shim_lie`' "$log" || {
              echo "::error::$crate's lie-check failed to build, but not with no-panic's link error"
              cat "$log"
              exit 1
            }
            echo "$crate: lie-check refused to link, for the right reason"
          }

          lie_check websocket-proto
          lie_check http3-proto
          lie_check http1-proto CARGO_PROFILE_RELEASE_LTO=fat
          lie_check http-semantics CARGO_PROFILE_RELEASE_LTO=fat
