[package]
name = "http3-proto"
version = "0.1.0"
edition = "2024"
# `benches/generated_static_lookup.rs` is `include!`d by the bench below, not a
# standalone target; disable auto-discovery so it is not built as its own bench.
autobenches = false
rust-version = "1.91.0"
license = "MIT OR Apache-2.0"
description = "Sans-I/O HTTP/3 Extended-CONNECT tunnel state machine (RFC 9114/9204/9220; no_std, no_alloc capable, panic-free)."
repository = "https://github.com/al8n/websockit"
readme = "README.md"
keywords = ["http3", "quic", "no-std", "sans-io", "websocket"]
categories = ["network-programming", "no-std", "embedded", "web-programming"]

[features]
default = ["std"]
std = ["thiserror/default", "dep:bytes", "bytes/std", "dep:slab", "slab/std", "dep:hashbrown", "hashbrown/default-hasher"]
alloc = ["dep:bytes", "dep:slab", "dep:hashbrown", "hashbrown/default-hasher"]
# `no-atomic`: the alloc tier for cores WITHOUT native atomic CAS (Cortex-M0+ /
# thumbv6m / RP2040). Same state machine as `alloc`, but the refcounted DATA
# buffer uses `portable_atomic_util::Arc<[u8]>` (cheap clone via
# `portable-atomic` + a `critical-section` impl provided by the final binary)
# instead of `bytes::Bytes`. Mutually exclusive with `alloc` / `std`.
no-atomic = [
  "dep:portable-atomic",
  "dep:portable-atomic-util",
  "portable-atomic/critical-section",
  "dep:slab",
  "dep:hashbrown",
  "hashbrown/default-hasher",
]
slab = ["dep:slab"]
# Internal: exposes `pub(crate)` hot paths so `tests/no_panic.rs` can wrap them
# in `#[no_panic]` shims. Implies `std` (the test driver is std-only). Not for
# downstream use — the re-exports are doc-hidden and unstable.
test-no-panic = ["std"]
# Internal, and MUST-FAIL by design: adds one `#[no_panic]` shim to
# `tests/no_panic.rs` whose body contains a reachable panic, so building that
# test in RELEASE has to fail to LINK. It is the permanent check that the link
# proof is not vacuous — a shim whose call the optimizer folded away would let
# every real shim "pass" with an empty proof, and nothing in a green run would
# say so. Measured on this crate: before every argument went through
# `black_box`, a reachable panic injected into `frame::decode_header`'s guarded
# re-slice linked CLEAN and the test reported `ok`. CI asserts the failure; see
# the `no-panic` job in `.github/workflows/ci.yml`. In debug the guard is off
# (the test's own `cfg_attr`), so `cargo hack --each-feature` and miri build and
# run this like any other test.
test-no-panic-lie = ["test-no-panic"]

[dependencies]
thiserror.workspace = true
derive_more.workspace = true
bytes = { workspace = true, optional = true }
slab = { version = "0.4", default-features = false, optional = true }
hashbrown = { version = "0.17", default-features = false, optional = true }
portable-atomic = { workspace = true, optional = true }
portable-atomic-util = { workspace = true, optional = true }

[dev-dependencies]
proptest = "1"
no-panic = "0.1"
phf = { version = "0.14.0", default-features = false, features = ["macros"] }
criterion = "0.8"

[[bench]]
name = "qpack_static_lookup"
harness = false
required-features = ["std"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
